<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS Cloud</title><style>
*{box-sizing:border-box}body{margin:0;background:#030711;color:#d9f7ff;font:14px Segoe UI,Arial;overflow-x:hidden}.grid{position:fixed;inset:0;background-image:linear-gradient(#0af1 1px,transparent 1px),linear-gradient(90deg,#0af1 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,#000,transparent);pointer-events:none}.wrap{max-width:1200px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;letter-spacing:8px}.online{color:#5ff}.orb{width:190px;height:190px;border:2px solid #19d9ff;border-radius:50%;margin:40px auto;box-shadow:0 0 35px #00bfff88,inset 0 0 35px #00bfff55;display:grid;place-items:center;animation:p 2.4s infinite}.orb:after{content:'J';font-size:58px;color:#7eefff;text-shadow:0 0 18px #0ff}@keyframes p{50%{transform:scale(1.04);box-shadow:0 0 70px #00bfffaa,inset 0 0 45px #00bfff66}}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#07111ddd;border:1px solid #148dbb88;border-radius:14px;padding:18px;box-shadow:0 0 22px #006c9222}.title{color:#70dfff;font-size:12px;letter-spacing:2px}.big{font-size:25px;margin-top:8px}.chat{margin-top:18px;display:flex;gap:10px}input{flex:1;background:#07111d;border:1px solid #168eb8;color:white;padding:14px;border-radius:10px}button{background:#08283a;color:#9ff;border:1px solid #16bce8;border-radius:10px;padding:12px 18px;cursor:pointer}.log{margin-top:14px;white-space:pre-wrap;min-height:70px}.red .orb{border-color:#ff334d;box-shadow:0 0 60px #f23}.red .orb:after{content:'⚠';color:#ff445d}.red .brand{color:#ff445d}</style></head><body><div class="grid"></div><div class="wrap" id="app"><div class="top"><div class="brand">JARVIS CLOUD</div><div class="online">● CLOUD ONLINE</div></div><div class="orb"></div><div class="cards"><div class="card"><div class="title">PC</div><div class="big" id="pc">AGUARDANDO</div></div><div class="card"><div class="title">J4+</div><div class="big" id="j4">AGUARDANDO</div></div><div class="card"><div class="title">SENTINELA</div><div class="big" id="sent">PRONTO</div></div><div class="card"><div class="title">MEMÓRIA</div><div class="big">SUPABASE</div></div></div><div class="chat"><input id="token" placeholder="JARVIS_CLOUD_TOKEN"><input id="msg" placeholder="Fale com o JARVIS..."><button onclick="talk()">ENVIAR</button><button onclick="sentinel()">⚠ SENTINELA</button></div><div class="card log" id="log">Configure o token e envie um comando.</div></div><script>
const H=()=>({'X-Jarvis-Token':document.querySelector('#token').value,'Content-Type':'application/json'});async function talk(){let t=msg.value;if(!t)return;log.textContent='PROCESSANDO...';let r=await fetch('/v1/chat',{method:'POST',headers:H(),body:JSON.stringify({device_id:'web-dashboard',text:t})});let j=await r.json();log.textContent=j.answer||JSON.stringify(j,null,2);msg.value=''}async function sentinel(){let on=!document.body.classList.contains('red');let r=await fetch('/v1/sentinel/state',{method:'POST',headers:H(),body:JSON.stringify({device_id:'j4plus',enabled:on})});if(r.ok){document.body.classList.toggle('red',on);sent.textContent=on?'ATIVO':'PRONTO'}}async function devices(){let token=document.querySelector('#token').value;if(!token)return;let r=await fetch('/v1/devices',{headers:H()});if(!r.ok)return;let j=await r.json();for(let d of j.devices){if(d.device_id.includes('pc'))pc.textContent=d.websocket_online?'● ONLINE':'○ OFFLINE';if(d.device_id.includes('j4'))j4.textContent=d.websocket_online?'● ONLINE':'● CLOUD'}}setInterval(devices,5000)</script></body></html>
